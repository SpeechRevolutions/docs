# Typecheck, compile every published snippet and build the docs on every push and
# pull request.
#
# check_snippets.py compiles every Go and C# snippet against the SDK source it
# finds in sibling directories, so the two SDK repos are checked out next to
# this one, reproducing the layout on a developer's machine.
#
# Deploys are not done here. Like every other service, the docs ship through a
# hand-run CD script (scripts/cd/deploy.sh) against infra that terraform owns
# (infra/terraform/docs.tf in the API repo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
      - uses: actions/checkout@v4
        with:
          repository: SpeechRevolutions/speechrevolutions-go
          path: speechrevolutions-go
      - uses: actions/checkout@v4
        with:
          repository: SpeechRevolutions/csharp-sdk
          path: csharp-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: docs
      - run: npx tsc --noEmit
        working-directory: docs
      - run: python3 scripts/check_snippets.py
        working-directory: docs
      # postbuild runs on its own after build: llms.txt, then the Pagefind index.
      - run: npm run build
        working-directory: docs
