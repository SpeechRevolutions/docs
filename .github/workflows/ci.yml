# Build and check the docs on every push and pull request; deploy main.
#
# The site is a static export (`output: "export"`), served from a private S3
# bucket behind CloudFront. There is no server: deploying is an `s3 sync` of
# `out/` plus a CloudFront invalidation. The bucket, distribution and deploy role
# are defined in infra/terraform/docs.tf in the API repo.
#
# check_snippets.py compiles every Go and C# snippet against the SDK source it
# finds in sibling directories, so the two SDK repos are checked out next to
# this one, reproducing the layout on a developer's machine.
#
# Deploy authenticates through GitHub OIDC; no AWS key is stored in GitHub. The
# role trusts only runs on main of this repo, so a pull request cannot deploy
# even if this workflow let it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-deploy the current main without an empty commit (Actions -> ci -> Run workflow).
  workflow_dispatch:

env:
  BUCKET: speechrevolutions-docs-153372322861
  DOMAIN: docs.speechrevolutions.com
  DEPLOY_ROLE: arn:aws:iam::153372322861:role/sr-docs-deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: docs
      - uses: actions/checkout@v4
        with:
          repository: SpeechRevolutions/speechrevolutions-go
          path: speechrevolutions-go
      - uses: actions/checkout@v4
        with:
          repository: SpeechRevolutions/csharp-sdk
          path: csharp-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: docs
      - run: npx tsc --noEmit
        working-directory: docs
      - run: python3 scripts/check_snippets.py
        working-directory: docs
      # postbuild runs on its own after build: llms.txt, then the Pagefind index.
      - run: npm run build
        working-directory: docs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/out
          # upload-artifact v4 drops dot-prefixed paths unless told otherwise, so
          # out/.well-known/ silently never reached the deploy job — the build was
          # green, the files were in out/, and the URLs 404'd in production. Anything
          # under .well-known/ is by definition hidden, so this is not optional here.
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No `environment:` here: declaring one changes the OIDC subject to
    # repo:...:environment:<name>, which the role's trust policy does not accept.
    # Two pushes in quick succession must not interleave their syncs.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: us-west-2
      # Looked up by alias rather than stored: the id only exists after terraform's
      # second apply.
      - name: Find the distribution
        run: |
          ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items || \`[]\`, '${DOMAIN}')].Id | [0]" \
            --output text)
          [ -n "$ID" ] && [ "$ID" != "None" ] || { echo "::error::no CloudFront distribution for ${DOMAIN}"; exit 1; }
          echo "DISTRIBUTION_ID=$ID" >> "$GITHUB_ENV"
      # Hashed build assets never change under a given name, so they cache for a
      # year. They go up first so a page never references a chunk that is not there
      # yet, and are never deleted: a tab opened before this deploy keeps working.
      - name: Upload hashed assets
        run: >
          aws s3 sync out/_next "s3://${BUCKET}/_next" --only-show-errors
          --cache-control "public, max-age=31536000, immutable"
      # Everything else (HTML, llms.txt, the search index, icons) keeps its name
      # across deploys, so browsers revalidate it on each visit.
      - name: Upload pages
        run: >
          aws s3 sync out "s3://${BUCKET}" --only-show-errors
          --exclude "_next/*" --delete
          --cache-control "public, max-age=0, must-revalidate"
      # Re-upload the text files with an explicit charset.
      #
      # `s3 sync` guesses the content type from the extension and, for .txt and .md, guesses
      # `text/plain` with NO charset. Everything here is UTF-8 and some of it is prose with
      # typographic punctuation, so a client that defaults to latin-1 renders mojibake — and
      # these two files exist specifically to be read by machines whose defaults we do not
      # control. www sends the charset; this makes docs match.
      # Belt and braces for the discovery files. They are the ones most likely to be
      # dropped by a tooling default (see include-hidden-files above) and the least
      # likely to be noticed missing, since nothing on the site links to them.
      - name: Upload the well-known files
        run: |
          for f in ard.json ai-catalog.json; do
            [ -f "out/.well-known/$f" ] || { echo "::error::out/.well-known/$f is missing"; exit 1; }
            aws s3 cp "out/.well-known/$f" "s3://${BUCKET}/.well-known/$f" --only-show-errors \
              --content-type "application/json; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done
      - name: Fix the text content types
        run: |
          for f in llms.txt auth.md; do
            [ -f "out/$f" ] || continue
            aws s3 cp "out/$f" "s3://${BUCKET}/$f" --only-show-errors \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done
          # Every page's Markdown twin, same reasoning.
          find out -name "*.md" -not -path "out/_next/*" | while read -r f; do
            key="${f#out/}"
            aws s3 cp "$f" "s3://${BUCKET}/${key}" --only-show-errors \
              --content-type "text/markdown; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done
      # One wildcard path counts as one against the 1,000 free paths a month.
      - name: Invalidate CloudFront
        run: |
          INV=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$INV"
      - name: Smoke check
        run: |
          fail=0
          check() {
            got=$(curl -s -o /dev/null -w '%{http_code}' "https://${DOMAIN}$1")
            if [ "$got" = "$2" ]; then echo "ok    $1 -> $got"; else echo "::error::$1 -> $got (want $2)"; fail=1; fi
          }
          check /                      200
          check /sdks/python/          200
          check /sdks/python           301
          check /llms.txt              200
          check /pagefind/pagefind.js  200
          check /no-such-page/         404
          exit $fail
